<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Astra Procurement Intelligence OS</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-shell">

        <header class="app-header">
            <div>
                <h1>Astra Procurement Intelligence OS</h1>
                <p>Feedstock Sourcing · Procurement Intelligence</p>
            </div>

            <div id="systemStatus" class="system-status">
                SYSTEM INITIALIZING
            </div>
        </header>

        <nav class="main-nav">
            <button data-page="dashboard">Dashboard</button>
            <button data-page="suppliers">Suppliers</button>
            <button data-page="products">Products</button>
            <button data-page="contacts">Contacts</button>
            <button data-page="documents">Documents</button>
            <button data-page="map">Mental Map</button>
        </nav>

        <main id="app">

            <section id="page-dashboard" class="page">
                <h2>Dashboard</h2>
                <p>Procurement intelligence system.</p>
            </section>

            <section id="page-suppliers" class="page hidden">
                <h2>Suppliers</h2>
            </section>

            <section id="page-products" class="page hidden">
                <h2>Products</h2>
            </section>

            <section id="page-contacts" class="page hidden">
                <h2>Contacts</h2>
            </section>

            <section id="page-documents" class="page hidden">
                <h2>Documents</h2>
            </section>

            <section id="page-map" class="page hidden">
                <h2>Mental Map</h2>
            </section>

        </main>

    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
